name: Validate and release plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.0"
        required: true
        type: string
      title:
        description: "Optional release title"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Codex plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Validate plugin
        run: python .github/scripts/validate_plugin.py .
      - name: Check taskflow-execute contract
        run: python .github/scripts/check_execute_contract.py .
      - name: Verify release tag matches plugin version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::release tag $RELEASE_TAG does not match plugin version $VERSION"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Use the exact commit this dispatch validated. A branch name could drift
      # between validation and release creation.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          if [ -n "$RELEASE_TITLE" ]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --generate-notes
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi

      # `--target` is ignored when the tag already exists, so verify the final
      # tag explicitly instead of trusting release creation alone.
      - name: Verify the tag points at the validated commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          ACTUAL="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$ACTUAL" != "$GITHUB_SHA" ]; then
            echo "::error::tag $RELEASE_TAG points at $ACTUAL, but this run validated $GITHUB_SHA. The release does not contain what was tested."
            exit 1
          fi
          echo "tag $RELEASE_TAG -> $ACTUAL (matches the validated commit)"
