name: Validate and release plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.0"
        required: true
        type: string
      title:
        description: "Optional release title"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Codex plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Validate plugin
        run: python scripts/validate_plugin.py .

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          if [ -n "$RELEASE_TITLE" ]; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --generate-notes
          else
            gh release create "$RELEASE_TAG" --generate-notes
          fi
