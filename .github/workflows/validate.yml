name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Codex plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Validate plugin
        run: python .github/scripts/validate_plugin.py .
      - name: Check taskflow-execute contract
        run: python .github/scripts/check_execute_contract.py .
